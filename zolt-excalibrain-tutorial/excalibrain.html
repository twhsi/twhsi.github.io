<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remote Work Policy Lab · Excalibrain View</title>
    <link rel="stylesheet" href="./styles.css?v=20260329m" />
  </head>
  <body data-view-mode="excalibrain">
    <div class="shell">
      <aside class="sidebar">
        <div class="panel-header">
          <div>
            <div id="sidebar-eyebrow" class="eyebrow">Vault</div>
            <h1 id="vault-title">Remote Work Policy Lab</h1>
          </div>
          <button id="sidebar-close" class="sidebar-btn sidebar-close" type="button" aria-label="Close sidebar">✕</button>
          <input id="search-input" type="search" placeholder="Search notes" />
        </div>
        <nav id="file-tree" class="tree"></nav>
      </aside>
      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close sidebar"></button>

      <main class="content">
        <header class="note-header">
          <button id="sidebar-toggle" class="sidebar-btn sidebar-toggle" type="button" aria-label="Open sidebar">☰</button>
          <button id="mobile-markdown-toggle" class="sidebar-btn mobile-view-btn" type="button" aria-label="Switch to markdown">M</button>
          <div class="note-title-wrap">
            <div id="reader-eyebrow" class="eyebrow">Publish-style Reader</div>
            <h2 id="note-title">Loading...</h2>
          </div>
          <button id="mobile-mandala-toggle" class="sidebar-btn mobile-view-btn" type="button" aria-label="Switch to mandala">9</button>
          <div id="note-meta" class="note-meta"></div>
        </header>
        <section id="mandala-shell" class="mandala-shell" hidden></section>
        <article id="note-body" class="markdown-body"></article>
      </main>

      <aside class="inspector excal-inspector">
        <section class="graph-panel excal-panel">
          <div class="panel-header compact">
            <div>
              <div class="eyebrow">Graph</div>
              <h3>Excalibrain</h3>
            </div>
            <a class="view-switch" href="./index.html" aria-label="Switch to local graph view">Local</a>
          </div>
          <div class="excal-controls">
            <input id="excal-filter" type="search" placeholder="filter links and tags" aria-label="Filter links and tags" />
            <div class="excal-toolbar" aria-hidden="true">
              <button type="button">✎</button>
              <button type="button">↩</button>
              <button type="button">↪</button>
              <button type="button">⟳</button>
              <button type="button">⌖</button>
              <button type="button">⊙</button>
              <button type="button">◫</button>
              <button type="button">⌗</button>
              <button type="button">⋯</button>
            </div>
          </div>
          <div id="excal-root" class="excal-root"></div>
          <div id="excal-status" class="excal-status"></div>
        </section>
      </aside>
    </div>

    <script type="module" src="./excalibrain.js?v=20260329m"></script>
  </body>
</html>
