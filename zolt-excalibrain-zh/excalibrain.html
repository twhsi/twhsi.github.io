<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>遠距工作政策中文站 · Excalibrain View</title>
    <link rel="stylesheet" href="./styles.css?v=20260329zh1" />
  </head>
  <body data-view-mode="excalibrain">
    <div class="shell">
      <aside class="sidebar">
        <div class="panel-header">
          <div>
            <div id="sidebar-eyebrow" class="eyebrow">知識庫</div>
            <h1 id="vault-title">遠距工作政策中文站</h1>
          </div>
          <button id="sidebar-close" class="sidebar-btn sidebar-close" type="button" aria-label="關閉側邊欄">✕</button>
          <input id="search-input" type="search" placeholder="搜尋筆記" />
        </div>
        <nav id="file-tree" class="tree"></nav>
      </aside>
      <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="關閉側邊欄"></button>

      <main class="content">
        <header class="note-header">
          <button id="sidebar-toggle" class="sidebar-btn sidebar-toggle" type="button" aria-label="開啟側邊欄">☰</button>
          <button id="mobile-markdown-toggle" class="sidebar-btn mobile-view-btn" type="button" aria-label="切換到文字">文</button>
          <div class="note-title-wrap">
            <div id="reader-eyebrow" class="eyebrow">中文閱讀</div>
            <h2 id="note-title">Loading...</h2>
          </div>
          <button id="mobile-mandala-toggle" class="sidebar-btn mobile-view-btn" type="button" aria-label="切換到九宮">9</button>
          <div id="note-meta" class="note-meta"></div>
        </header>
        <section id="mandala-shell" class="mandala-shell" hidden></section>
        <article id="note-body" class="markdown-body"></article>
      </main>

      <aside class="inspector excal-inspector">
        <section class="graph-panel excal-panel">
          <div class="panel-header compact">
            <div>
              <div class="eyebrow">Graph</div>
              <h3>Excalibrain</h3>
            </div>
            <a class="view-switch" href="./index.html" aria-label="切換到局部關聯圖">局部</a>
          </div>
          <div class="excal-controls">
            <input id="excal-filter" type="search" placeholder="篩選連結與標籤" aria-label="篩選連結與標籤" />
            <div class="excal-toolbar" aria-hidden="true">
              <button type="button">✎</button>
              <button type="button">↩</button>
              <button type="button">↪</button>
              <button type="button">⟳</button>
              <button type="button">⌖</button>
              <button type="button">⊙</button>
              <button type="button">◫</button>
              <button type="button">⌗</button>
              <button type="button">⋯</button>
            </div>
          </div>
          <div id="excal-root" class="excal-root"></div>
          <div id="excal-status" class="excal-status"></div>
        </section>
      </aside>
    </div>

    <script type="module" src="./excalibrain.js?v=20260329zh1"></script>
  </body>
</html>
