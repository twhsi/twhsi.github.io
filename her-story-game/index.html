<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Her Story 卡片文字遊戲</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #0f172a;
      --panel-2: #1e293b;
      --border: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #ef4444;
      --accent-2: #38bdf8;
      --choice: #1d4ed8;
      --choice-hover: #2563eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, 42vw);
      min-height: 100vh;
    }

    .story-panel {
      padding: 22px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: linear-gradient(180deg, #111827 0%, #0b1220 100%);
    }

    .right-panel {
      display: grid;
      grid-template-rows: 58% 42%;
      min-height: 100vh;
    }

    .story-title {
      font-size: 2rem;
      margin: 0 0 12px 0;
      line-height: 1.2;
    }

    .story-meta {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 14px;
    }

    .story-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
    }

    .utility-btn {
      border: 1px solid var(--border);
      background: #172554;
      color: #dbeafe;
      font-size: 0.95rem;
      line-height: 1.1;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .utility-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .utility-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .save-status {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .story-text {
      font-size: 1.28rem;
      line-height: 1.9;
      white-space: pre-line;
      margin-bottom: 24px;
      min-height: 5.6em;
    }

    .choices {
      display: grid;
      gap: 12px;
    }

    .choice-btn {
      border: 1px solid #3b82f6;
      background: var(--choice);
      color: white;
      font-size: 1.08rem;
      line-height: 1.5;
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .choice-btn:hover {
      background: var(--choice-hover);
      transform: translateY(-1px);
    }

    .graph-panel {
      position: relative;
      border-bottom: 1px solid var(--border);
      background:
        radial-gradient(circle at center, rgba(56,189,248,0.08), transparent 42%),
        #0b1120;
      overflow: hidden;
    }

    .graph-title {
      position: absolute;
      left: 16px;
      top: 10px;
      z-index: 2;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.04em;
    }

    #graph-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .node {
      position: absolute;
      z-index: 1;
      min-width: 110px;
      max-width: 180px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      text-align: center;
      font-size: 1rem;
      line-height: 1.35;
      cursor: pointer;
      transform: translate(-50%, -50%);
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    }

    .node.center {
      background: var(--accent);
      border-color: #f87171;
      font-weight: 700;
      font-size: 1.08rem;
    }

    .node.small {
      font-size: 0.94rem;
      background: #13233d;
    }

    .grid-panel {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      background: #0f172a;
      min-height: 0;
    }

    .grid-cell {
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      font-size: 1.15rem;
      line-height: 1.35;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .grid-cell:hover {
      background: rgba(255,255,255,0.04);
    }

    .grid-center {
      background: rgba(239,68,68,0.14);
      font-weight: 700;
      color: #fecaca;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .story-panel {
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .right-panel {
        grid-template-rows: 30vh 32vh;
        min-height: 62vh;
      }

      .story-title { font-size: 1.7rem; }
      .story-text { font-size: 1.12rem; line-height: 1.8; }
      .choice-btn { font-size: 1rem; }
      .grid-cell { font-size: 1rem; }
      .node { min-width: 88px; max-width: 130px; font-size: 0.88rem; }
    }
  </style>
</head>
<body>

        <span class="save-status" id="save-status"></span>

      <div class="story-text" id="story-text"></div>
      <div class="choices" id="choices"></div>
    </section>

    <aside class="right-panel">
      <section class="graph-panel" id="graph-panel">
        <div class="graph-title">Graph / Excalibrain 風導航</div>
        <svg id="graph-svg"></svg>
      </section>

      <section class="grid-panel">
        <div class="grid-cell" onclick="jumpToMOC('identity')">Identity</div>
        <div class="grid-cell" onclick="jumpToMOC('timeline')">Timeline</div>
        <div class="grid-cell" onclick="jumpToMOC('relationship')">Relationship</div>

        <div class="grid-cell" onclick="jumpToMOC('keywords')">Keywords</div>

        <div class="grid-cell" onclick="jumpToMOC('narrative')">Narrative</div>

        <div class="grid-cell" onclick="jumpToMOC('inference')">Inference</div>
        <div class="grid-cell" onclick="jumpToMOC('contradiction')">Contradiction</div>
      </section>
    </aside>
  </div>

    const mocMap = {
      identity: ["HS_G_006", "HS_G_012", "HS_G_022", "HS_G_023", "HS_G_030", "HS_G_032"],
      timeline: ["HS_G_004", "HS_G_007", "HS_G_008", "HS_G_009", "HS_G_010", "HS_G_016", "HS_G_017", "HS_G_020", "HS_G_021", "HS_G_025", "HS_G_026", "HS_G_028", "HS_G_029", "HS_G_031"],
      relationship: ["HS_G_003", "HS_G_013", "HS_G_014", "HS_G_017", "HS_G_018", "HS_G_024", "HS_G_025", "HS_G_026", "HS_G_027", "HS_G_028", "HS_G_029"],
      keywords: ["HS_G_004", "HS_G_018", "HS_G_019", "HS_G_028", "HS_G_029", "HS_G_032"],
      narrative: ["HS_G_001", "HS_G_002", "HS_G_003", "HS_G_004", "HS_G_005", "HS_G_006", "HS_G_007", "HS_G_008", "HS_G_009", "HS_G_010", "HS_G_011", "HS_G_012", "HS_G_013", "HS_G_014", "HS_G_015", "HS_G_016", "HS_G_017", "HS_G_018", "HS_G_019", "HS_G_020", "HS_G_021", "HS_G_022", "HS_G_023", "HS_G_024", "HS_G_025", "HS_G_026", "HS_G_027", "HS_G_028", "HS_G_029", "HS_G_030", "HS_G_031", "HS_G_032"],
      clues: ["HS_G_010", "HS_G_011", "HS_G_012", "HS_G_018", "HS_G_019", "HS_G_021", "HS_G_022", "HS_G_023", "HS_G_027", "HS_G_029", "HS_G_030"],
      inference: ["HS_G_005", "HS_G_006", "HS_G_020", "HS_G_030", "HS_G_031", "HS_G_032"],
      contradiction: ["HS_G_004", "HS_G_005", "HS_G_014", "HS_G_015", "HS_G_017", "HS_G_018", "HS_G_021", "HS_G_027", "HS_G_030", "HS_G_032"]
    };

    const SAVE_KEY = "her_story_progress_v1";
    const TYPE_INTERVAL_MS = 24;

    let currentId = "HS_G_001";
    let historyStack = ["HS_G_001"];
    let typeTimer = null;
    let statusTimer = null;
    let audioContext = null;
    let lastTickAt = 0;

    function parseSavedProgress() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!data || typeof data.currentId !== "string" || !story[data.currentId]) return null;
        const safeHistory = Array.isArray(data.historyStack)
          ? data.historyStack.filter(id => typeof id === "string" && story[id])
          : [];
        if (!safeHistory.length || safeHistory[safeHistory.length - 1] !== data.currentId) {
          safeHistory.push(data.currentId);
        }
        return {
          currentId: data.currentId,
          historyStack: safeHistory,
          savedAt: data.savedAt || ""
        };
      } catch (err) {
        return null;
      }
    }

    function updateBackButtonState() {
      const backBtn = document.getElementById("btn-back");
      backBtn.disabled = historyStack.length <= 1;
    }

    function updateLoadButtonState() {
      const loadBtn = document.getElementById("btn-load");
      loadBtn.disabled = !parseSavedProgress();
    }

    function setStatus(message, timeoutMs = 2200) {
      const el = document.getElementById("save-status");
      el.textContent = message;
      if (statusTimer) clearTimeout(statusTimer);
      if (timeoutMs > 0) {
        statusTimer = setTimeout(() => {
          el.textContent = "";
        }, timeoutMs);
      }
    }

    function saveProgress(showMessage = false) {
      try {
        const payload = {
          currentId,
          historyStack,
          savedAt: new Date().toISOString()
        };
        localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
        updateLoadButtonState();
        if (showMessage) setStatus("已儲存目前進度");
      } catch (err) {
        if (showMessage) setStatus("儲存失敗（瀏覽器限制）");
      }
    }

    function loadProgress(showMessage = false) {
      const data = parseSavedProgress();
      if (!data) {
        updateLoadButtonState();
        if (showMessage) setStatus("目前沒有可讀取的存檔");
        return false;
      }
      currentId = data.currentId;
      historyStack = data.historyStack;
      renderScene(showMessage ? "讀取續玩進度" : "已續玩上次進度");
      renderGraph();
      updateBackButtonState();
      if (showMessage) setStatus("已讀取存檔");
      return true;
    }

    function primeAudio() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!audioContext) audioContext = new AudioCtx();
      if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
      }
    }

    function playTypeTick(index, char) {
      if (!audioContext || audioContext.state !== "running") return;
      const now = audioContext.currentTime;
      if (now - lastTickAt < 0.03) return;
      lastTickAt = now;

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const punctuationBoost = /[，。！？；：,.!?]/.test(char) ? 24 : 0;

      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(460 + (index % 5) * 28 + punctuationBoost, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.018, now + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.048);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.05);
    }

    function stopTypewriter() {
      if (typeTimer) {
        clearTimeout(typeTimer);
        typeTimer = null;
      }
    }

    function typewriteText(text) {
      const textEl = document.getElementById("story-text");
      stopTypewriter();
      textEl.textContent = "";
      let i = 0;

      const writeNext = () => {
        if (i >= text.length) {
          typeTimer = null;
          return;
        }

        const char = text[i];
        textEl.textContent += char;
        if (/\S/.test(char)) playTypeTick(i, char);
        i += 1;

        let delay = TYPE_INTERVAL_MS;
        if (/[，。！？；：,.!?]/.test(char)) delay += 90;
        if (char === "\n") delay += 120;
        typeTimer = setTimeout(writeNext, delay);
      };

      writeNext();
    }

    function navigateTo(id, extraMeta = "", pushHistory = true) {
      if (!story[id]) return;
      currentId = id;
      if (pushHistory && historyStack[historyStack.length - 1] !== id) {
        historyStack.push(id);
      }
      renderScene(extraMeta);
      renderGraph();
      updateBackButtonState();
      saveProgress(false);
    }

    function goTo(id) {
      primeAudio();
      navigateTo(id);
    }

    function jumpToMOC(mocKey) {
      const list = mocMap[mocKey];
      if (!list || !list.length) return;
      primeAudio();
      navigateTo(list[0], `九宮入口：${mocKey}`);
    }

    function goBack() {
      if (historyStack.length <= 1) {
        updateBackButtonState();
        setStatus("已在故事起點");
        return;
      }
      historyStack.pop();
      const previousId = historyStack[historyStack.length - 1];
      navigateTo(previousId, "返回上一段", false);
    }

    function restartStory() {
      currentId = "HS_G_001";
      historyStack = ["HS_G_001"];
      renderScene("重新開始");
      renderGraph();
      updateBackButtonState();
      saveProgress(true);
    }

    function renderScene(extraMeta = "") {
      const node = story[currentId];
      document.getElementById("story-title").textContent = node.title;
      document.getElementById("story-meta").textContent =
        `編號：${currentId}　|　標籤：${node.tags.join(" / ")}${extraMeta ? "　|　" + extraMeta : ""}`;
      typewriteText(node.text);

      const choicesEl = document.getElementById("choices");
      choicesEl.innerHTML = "";

      node.choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = `→ ${choice.label}`;
        btn.onclick = () => goTo(choice.target);
        choicesEl.appendChild(btn);
      });
    }

    function renderGraph() {
      const panel = document.getElementById("graph-panel");
      const svg = document.getElementById("graph-svg");

      panel.querySelectorAll(".node").forEach(n => n.remove());
      svg.innerHTML = "";

      const center = { x: 50, y: 50 };
      const positions = [
        { x: 50, y: 18 },
        { x: 20, y: 50 },
        { x: 80, y: 50 },
        { x: 50, y: 82 },
        { x: 28, y: 22 },
        { x: 72, y: 22 }
      ];

      const centerNode = makeNode(currentId, story[currentId].title, center.x, center.y, true);
      panel.appendChild(centerNode);

      const targets = story[currentId].choices.slice(0, 6).map(c => c.target);

      targets.forEach((targetId, i) => {
        const p = positions[i];
        const n = makeNode(targetId, story[targetId].title, p.x, p.y, false);
        panel.appendChild(n);
        drawLine(center.x, center.y, p.x, p.y, svg);
      });
    }

    function makeNode(id, label, x, y, isCenter) {
      const div = document.createElement("div");
      div.className = `node ${isCenter ? "center" : "small"}`;
      div.style.left = `${x}%`;
      div.style.top = `${y}%`;
      div.textContent = label;
      div.title = id;
      div.onclick = () => goTo(id);
      return div;
    }

    function drawLine(x1p, y1p, x2p, y2p, svg) {
      const w = svg.clientWidth || svg.parentElement.clientWidth;
      const h = svg.clientHeight || svg.parentElement.clientHeight;

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", (x1p / 100) * w);
      line.setAttribute("y1", (y1p / 100) * h);
      line.setAttribute("x2", (x2p / 100) * w);
      line.setAttribute("y2", (y2p / 100) * h);
      line.setAttribute("stroke", "#64748b");
      line.setAttribute("stroke-width", "2");
      line.setAttribute("opacity", "0.9");
      svg.appendChild(line);
    }

    window.addEventListener("resize", renderGraph);
    window.addEventListener("pointerdown", primeAudio, { once: true });
    window.addEventListener("keydown", primeAudio, { once: true });

    document.getElementById("btn-back").addEventListener("click", goBack);
    document.getElementById("btn-restart").addEventListener("click", restartStory);
    document.getElementById("btn-save").addEventListener("click", () => saveProgress(true));
    document.getElementById("btn-load").addEventListener("click", () => loadProgress(true));

    updateLoadButtonState();
    const resumed = loadProgress(false);
    if (!resumed) {
      renderScene();
      renderGraph();
      updateBackButtonState();
      saveProgress(false);
    }
  </script>
